<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>住宿訂房 | Agent TT</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.results-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
@media(max-width:900px){.results-layout{grid-template-columns:1fr;}}
.filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;position:sticky;top:76px;}
.filter-section{margin-bottom:20px;}
.filter-title{font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.amenity-check{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0;cursor:pointer;}
.amenity-check input{accent-color:var(--primary);}
.price-range{display:flex;align-items:center;gap:8px;}
.hotel-list{display:flex;flex-direction:column;gap:16px;}
.hotel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);display:flex;gap:0;overflow:hidden;transition:var(--t);}
.hotel-card:hover{box-shadow:var(--shadow-lg);border-color:var(--primary-light);}
.hotel-thumb{width:200px;flex-shrink:0;background:linear-gradient(135deg,var(--bg-alt),var(--border));display:flex;align-items:center;justify-content:center;font-size:52px;color:var(--text-muted);}
.hotel-info{flex:1;padding:20px;}
.hotel-name{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.hotel-meta{font-size:13px;color:var(--text-muted);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap;}
.hotel-amenities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.amenity-tag{background:var(--bg-alt);color:var(--text-sub);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-full);font-size:12px;}
.hotel-price{font-size:20px;font-weight:700;color:var(--primary);}
.hotel-price span{font-size:13px;font-weight:400;color:var(--text-muted);}
@media(max-width:600px){.hotel-card{flex-direction:column;}.hotel-thumb{width:100%;height:160px;}}
.cart-btn{position:relative;background:none;border:1px solid var(--border);border-radius:var(--r-md);padding:6px 12px;cursor:pointer;font-size:15px;color:var(--text);transition:var(--t);}
.cart-btn:hover{background:var(--bg-alt);border-color:var(--primary);}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;line-height:1;}
.cart-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;}
.cart-drawer-overlay.open{opacity:1;pointer-events:auto;}
.cart-drawer{position:fixed;top:0;right:-380px;width:360px;height:100%;background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1);}
.cart-drawer-overlay.open .cart-drawer{right:0;}
.cart-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cart-drawer-title{font-size:16px;font-weight:700;}
.cart-drawer-body{flex:1;overflow-y:auto;padding:16px;}
.cart-item{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:12px;}
.cart-item-name{font-size:15px;font-weight:600;margin-bottom:6px;}
.cart-item-meta{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
.cart-item-actions{display:flex;gap:8px;}
.cart-empty{text-align:center;padding:48px 0;color:var(--text-muted);}
.cart-empty-icon{font-size:40px;margin-bottom:12px;}
@media(max-width:420px){.cart-drawer{width:100%;right:-100%;}}
</style>
</head>
<body>
<div class="page-wrap">
<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">Agent TT <span>智慧旅遊平台</span></a>
    <nav class="navbar-nav">
      <a href="../index.html" class="nav-link">🏠 首頁</a>
      <a href="itinerary-list.html" class="nav-link">📅 行程規劃</a>
      <a href="housing-search.html" class="nav-link active">🏨 住宿訂房</a>
      <a href="train-search.html" class="nav-link">🚂 台鐵車票</a>
    </nav>
    <div class="navbar-right">
      <a href="housing-orders.html" class="btn btn-secondary btn-sm">我的訂單</a>
      <button class="cart-btn" onclick="openCartDrawer()" title="購物車">
        🛒 <span id="cart-count-text">購物車</span>
        <span class="cart-badge hidden" id="cart-badge">0</span>
      </button>
      <span class="points-badge" id="nav-points">⭐ 載入中</span>
      <div class="avatar">JJ</div>
    </div>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <div class="page-header-inner">
      <h1 class="page-title">🏨 住宿訂房</h1>
      <p class="page-subtitle">搜尋竹竹苗台鐵小站周邊的優質民宿與旅館</p>
    </div>
  </div>

  <div class="section">
  <div class="container">

    <!-- Search Bar -->
    <div class="search-box mb-6">
      <div class="form-row form-row-4" style="gap:12px;align-items:flex-end;">
        <div class="form-group">
          <label class="form-label">附近車站</label>
          <select class="form-control" id="f-station">
            <option value="">全部車站</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">入住日期</label>
          <input class="form-control" id="f-checkin" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">退房日期</label>
          <input class="form-control" id="f-checkout" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">入住人數</label>
          <select class="form-control" id="f-guests">
            <option value="1">1 人</option><option value="2" selected>2 人</option>
            <option value="3">3 人</option><option value="4">4 人</option>
          </select>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <button class="btn btn-primary" onclick="doSearch()">🔍 搜尋住宿</button>
      </div>
    </div>

    <!-- Results Layout -->
    <div class="results-layout">

      <!-- Filter Sidebar -->
      <div class="filter-panel">
        <div class="filter-section">
          <div class="filter-title">房型</div>
          <div id="type-filters" style="display:flex;flex-direction:column;gap:4px;"></div>
        </div>
        <div class="filter-section">
          <div class="filter-title">每晚價格</div>
          <div class="price-range">
            <input class="form-control" id="f-price-min" type="number" placeholder="最低" min="0" value="0">
            <span class="text-muted">—</span>
            <input class="form-control" id="f-price-max" type="number" placeholder="最高" min="0" value="9999">
          </div>
        </div>
        <div class="filter-section">
          <div class="filter-title">最低評分</div>
          <select class="form-control" id="f-rating">
            <option value="0">不限</option>
            <option value="4">4 分以上</option>
            <option value="4.5">4.5 分以上</option>
          </select>
        </div>
        <div class="filter-section">
          <div class="filter-title">設備/服務</div>
          <div id="amenity-filters"></div>
        </div>
        <div class="filter-section">
          <div class="filter-title">距車站</div>
          <select class="form-control" id="f-dist">
            <option value="99">不限</option>
            <option value="0.5">0.5km 以內</option>
            <option value="1">1km 以內</option>
          </select>
        </div>
        <button class="btn btn-primary btn-full mt-3" onclick="applyFilters()">套用篩選</button>
        <button class="btn btn-ghost btn-full mt-2" onclick="resetFilters()">重設</button>
      </div>

      <!-- Hotel List -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div class="text-sub fw-500" id="result-count">共 0 間住宿</div>
          <select class="form-control" style="width:140px;" id="f-sort" onchange="applyFilters()">
            <option value="rating">評分最高</option>
            <option value="price-asc">價格低到高</option>
            <option value="price-desc">價格高到低</option>
            <option value="dist">距車站最近</option>
          </select>
        </div>
        <div class="hotel-list" id="hotel-list"></div>
        <div id="no-result" class="empty-state hidden">
          <div class="empty-icon">🏨</div>
          <div class="empty-title">找不到符合條件的住宿</div>
          <div class="empty-text">試試放寬篩選條件</div>
        </div>
      </div>

    </div>
  </div>
  </div>
</main>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer-overlay" id="cart-overlay" onclick="closeCartDrawer()">
  <div class="cart-drawer" onclick="event.stopPropagation()">
    <div class="cart-drawer-head">
      <span class="cart-drawer-title">🛒 購物車</span>
      <button class="btn-icon" onclick="closeCartDrawer()">✕</button>
    </div>
    <div class="cart-drawer-body" id="cart-drawer-body"></div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/store.js"></script>
<script>
Store.init();
document.getElementById('nav-points').textContent = `⭐ ${Store.getPoints().toLocaleString()} 點`;

// Populate station dropdown
const stationSel = document.getElementById('f-station');
ALL_STATIONS.filter(s=>s.region==='竹竹苗').forEach(s=>{
  const opt = document.createElement('option');
  opt.value=s.id; opt.textContent=s.name; stationSel.appendChild(opt);
});

// Set date defaults
const today = Utils.today();
const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
const tomStr = tomorrow.toISOString().split('T')[0];
document.getElementById('f-checkin').value = today;
document.getElementById('f-checkout').value = tomStr;

// Populate type filters
const types = [...new Set(HOTELS.map(h=>h.type))];
document.getElementById('type-filters').innerHTML = types.map(t=>`
  <label class="amenity-check">
    <input type="checkbox" class="type-cb" value="${t}" checked> ${t}
  </label>`).join('');

// Populate amenity filters
const allAmenities = [...new Set(HOTELS.flatMap(h=>h.amenities))];
document.getElementById('amenity-filters').innerHTML = allAmenities.map(a=>`
  <label class="amenity-check">
    <input type="checkbox" class="amenity-cb" value="${a}"> ${a}
  </label>`).join('');

let filteredHotels = [...HOTELS];

function doSearch() {
  applyFilters();
  showToast('搜尋完成', 'success');
}

function applyFilters() {
  const stationId = document.getElementById('f-station').value;
  const priceMin = parseInt(document.getElementById('f-price-min').value)||0;
  const priceMax = parseInt(document.getElementById('f-price-max').value)||9999;
  const minRating = parseFloat(document.getElementById('f-rating').value)||0;
  const maxDist = parseFloat(document.getElementById('f-dist').value)||99;
  const checkedTypes = [...document.querySelectorAll('.type-cb:checked')].map(c=>c.value);
  const checkedAmenities = [...document.querySelectorAll('.amenity-cb:checked')].map(c=>c.value);
  const sort = document.getElementById('f-sort').value;

  filteredHotels = HOTELS.filter(h=>{
    if (stationId && h.station !== stationId) return false;
    if (h.priceMin > priceMax || h.priceMax < priceMin) return false;
    if (h.rating < minRating) return false;
    if (h.stationDist > maxDist) return false;
    if (!checkedTypes.includes(h.type)) return false;
    if (checkedAmenities.length && !checkedAmenities.every(a=>h.amenities.includes(a))) return false;
    return true;
  });

  if (sort==='rating') filteredHotels.sort((a,b)=>b.rating-a.rating);
  else if (sort==='price-asc') filteredHotels.sort((a,b)=>a.priceMin-b.priceMin);
  else if (sort==='price-desc') filteredHotels.sort((a,b)=>b.priceMin-a.priceMin);
  else if (sort==='dist') filteredHotels.sort((a,b)=>a.stationDist-b.stationDist);

  renderHotels();
}

function resetFilters() {
  document.querySelectorAll('.type-cb').forEach(c=>c.checked=true);
  document.querySelectorAll('.amenity-cb').forEach(c=>c.checked=false);
  document.getElementById('f-price-min').value=0;
  document.getElementById('f-price-max').value=9999;
  document.getElementById('f-rating').value=0;
  document.getElementById('f-dist').value=99;
  document.getElementById('f-station').value='';
  applyFilters();
}

function renderHotels() {
  const favs = Store.getFavorites();
  document.getElementById('result-count').textContent = `共 ${filteredHotels.length} 間住宿`;
  const noResult = document.getElementById('no-result');
  const list = document.getElementById('hotel-list');
  if (!filteredHotels.length) { list.innerHTML=''; noResult.classList.remove('hidden'); return; }
  noResult.classList.add('hidden');
  list.innerHTML = filteredHotels.map(h=>{
    const isFav = favs.includes(h.id);
    const stationName = Utils.getStationName(h.station);
    return `
    <div class="hotel-card">
      <div class="hotel-thumb">${h.images[0]}</div>
      <div class="hotel-info">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="hotel-name">${h.name}</div>
            <div class="hotel-meta">
              <span>📍 ${stationName}站 ${h.stationDist}km</span>
              <span class="rating">★ ${h.rating}</span>
              <span class="text-muted">(${h.reviewCount} 則評價)</span>
              <span class="badge badge-muted">${h.type}</span>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn-icon" title="${isFav?'取消收藏':'加入收藏'}" onclick="toggleFav('${h.id}',this)">${isFav?'❤️':'🤍'}</button>
            <button class="btn-icon" title="加入購物車" onclick="addCart('${h.id}')">🛒</button>
          </div>
        </div>
        <div class="hotel-amenities">${h.amenities.map(a=>`<span class="amenity-tag">${a}</span>`).join('')}</div>
        <p class="text-sm text-muted" style="margin-bottom:12px;">${h.desc.slice(0,60)}...</p>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div class="hotel-price">${Utils.formatCurrency(h.priceMin)} <span>起 / 晚</span></div>
          <a href="housing-detail.html?id=${h.id}" class="btn btn-primary">查看詳情 →</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleFav(hotelId, btn) {
  const isFav = Store.toggleFavorite(hotelId);
  btn.textContent = isFav ? '❤️' : '🤍';
  btn.title = isFav ? '取消收藏' : '加入收藏';
  showToast(isFav ? '已加入收藏' : '已取消收藏', isFav?'success':'');
}

function addCart(hotelId) {
  const h = HOTELS.find(h=>h.id===hotelId);
  Store.addToCart({ hotelId, hotelName:h.name, addedAt:Date.now() });
  showToast(`「${h.name}」已加入購物車`, 'success');
  updateCartBadge();
}

function updateCartBadge() {
  const count = Store.getCart().length;
  const badge = document.getElementById('cart-badge');
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function openCartDrawer() {
  renderCart();
  document.getElementById('cart-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeCartDrawer() {
  document.getElementById('cart-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function renderCart() {
  const items = Store.getCart();
  const body = document.getElementById('cart-drawer-body');
  if (!items.length) {
    body.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div><div>購物車是空的</div><div class="text-sm text-muted" style="margin-top:8px;">在住宿列表點擊 🛒 加入</div></div>`;
    return;
  }
  body.innerHTML = items.map(item => {
    const h = HOTELS.find(h => h.id === item.hotelId);
    if (!h) return '';
    return `
    <div class="cart-item" id="cart-item-${item.hotelId}">
      <div class="cart-item-name">${h.name}</div>
      <div class="cart-item-meta">
        📍 ${Utils.getStationName(h.station)}站 · ★ ${h.rating} · ${h.type}<br>
        ${Utils.formatCurrency(h.priceMin)} 起 / 晚
      </div>
      <div class="cart-item-actions">
        <a href="housing-detail.html?id=${h.id}" class="btn btn-primary btn-sm" style="flex:1;">前往訂房 →</a>
        <button class="btn btn-ghost btn-sm" onclick="removeCartItem('${h.id}')">移除</button>
      </div>
    </div>`;
  }).join('');
}

function removeCartItem(hotelId) {
  Store.removeFromCart(hotelId, undefined);
  updateCartBadge();
  renderCart();
  const h = HOTELS.find(h => h.id === hotelId);
  showToast(`「${h ? h.name : ''}」已從購物車移除`, '');
}

updateCartBadge();
applyFilters();
</script>
</body>
</html>
